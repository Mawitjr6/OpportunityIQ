<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpportunityIQ Lead Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>OpportunityIQ Lead Management</h1>
   <form id="leadForm">

    <input
        type="text"
        id="company"
        placeholder="Company Name"
        required>

    <input
        type="text"
        id="contact"
        placeholder="Contact Person">

    <input
        type="email"
        id="email"
        placeholder="Email">

    <button type="submit">
        Save Lead
    </button>

</form>
<hr>
<!-- Upload Document Section -->
<h2>Upload Document</h2>

<form
id="uploadForm"
enctype="multipart/form-data">

<input
type="file"
id="document">

<button type="submit">
Upload
</button>

</form>
<hr>
<!-- Load Leads Section -->
    <button onclick="loadLeads()">Load Leads</button>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="leadTableBody">

        </tbody>
    </table>

    <script src="js/leads.js"></script>

</body>
</html>
