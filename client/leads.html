<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpportunityIQ Lead Management</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>OpportunityIQ Lead Management</h1>

    <!-- ADD NEW LEAD -->

    <h2>Add New Lead</h2>

    <form id="leadForm">

        <input
            type="text"
            id="company"
            placeholder="Company Name"
            required>

        <input
            type="text"
            id="contact"
            placeholder="Contact Person">

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="text"
            id="phone"
            placeholder="Phone Number">

        <input
            type="text"
            id="source"
            placeholder="Lead Source">

        <button type="submit">
            Save Lead
        </button>

    </form>

    <hr>

    <!-- DOCUMENT UPLOAD -->

    <h2>Upload Document</h2>

    <form
        id="uploadForm"
        enctype="multipart/form-data">

        <input
            type="file"
            id="document"
            required>

        <button type="submit">
            Upload
        </button>

    </form>

    <hr>

    <!-- DOCUMENT REPOSITORY -->

    <h2>Uploaded Documents</h2>

    <button onclick="loadDocuments()">
        Load Documents
    </button>

    <ul id="documentList">

    </ul>

    <hr>

    <!-- LEADS SECTION -->

    <button onclick="loadLeads()">
        Load Leads
    </button>

    <br><br>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Source</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="leadTableBody">

        </tbody>

    </table>

    <script src="js/leads.js"></script>

</body>
</html>
